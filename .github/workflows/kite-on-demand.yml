name: Kite On-Demand Dispatch

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.comment.body, '@kite') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR: ${{ github.event.inputs.pr_number || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request.url || '' }}
          REVIEW_PR_URL: ${{ github.event.comment.pull_request_url || '' }}
        run: |
          set -euo pipefail
          pr_number="$MANUAL_PR"
          if [[ -z "$pr_number" && "$EVENT_NAME" == "issue_comment" && -n "$ISSUE_IS_PR" ]]; then
            pr_number="$ISSUE_NUMBER"
          fi
          if [[ -z "$pr_number" && -n "$REVIEW_PR_URL" ]]; then
            pr_number="${REVIEW_PR_URL##*/}"
          fi
          if [[ -z "$pr_number" ]]; then
            echo "No pull request context; skipping."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr view "$pr_number" --json number,headRefName,headRepositoryOwner >/tmp/kite-pr.json
          echo "number=$pr_number" >>"$GITHUB_OUTPUT"
          echo "skip=false" >>"$GITHUB_OUTPUT"

      - name: Dispatch Kite review
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh workflow run raptor-agentic-review.lock.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f enable_codeql=false \
            -f raptor_image="${KITE_RAPTOR_IMAGE:-raptor:latest}" \
            -f pr_number="$PR_NUMBER" \
            -f openai_second_opinion=true
          gh pr comment "$PR_NUMBER" --body "Kite review dispatched for PR #$PR_NUMBER."
