name: Zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - '**/action.yml'
      - '**/action.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - '**/action.yml'
      - '**/action.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
          annotations: true
